name: ClaudeHUD
options:
  bundleIdPrefix: com.claudehud
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

# Code the Topaz helpers share (Loupe and Topaz Launcher).
packages:
  TopazKit:
    path: TopazKit

targets:
  ClaudeHUD:
    type: application
    platform: macOS
    sources:
      - path: ClaudeHUD
        excludes:
          - "**/*.entitlements"
    resources:
      - path: ClaudeHUD/Resources/ntfy-notify.sh
    dependencies:
      - sdk: CoreText.framework
      - package: TopazKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudehud.app
        PRODUCT_NAME: ClaudeHUD
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: ClaudeHUD/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClaudeHUD/Resources/ClaudeHUD.entitlements
        CODE_SIGN_IDENTITY: "ClaudeHUD Dev"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO

  # Topaz Launcher: the application launcher (Option-Space) and Magnet's
  # window snapping, nested in Topaz.app/Contents/Helpers and supervised by
  # Topaz (wezterm-gui helpers.rs). Built by topaz-build.sh.
  TopazLauncher:
    type: application
    platform: macOS
    sources:
      - path: TopazLauncher
        excludes:
          - Info.plist
    dependencies:
      - package: TopazKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbdaniels.topaz.launcher
        PRODUCT_NAME: "Topaz Launcher"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: TopazLauncher/Info.plist
        CODE_SIGN_IDENTITY: "ClaudeHUD Dev"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
    scheme: {}

  # Unit tests for the pure, Foundation-only logic. No host app: the bundle
  # compiles the sources it tests directly, so tests never launch ClaudeHUD.
  # Run: xcodebuild test -scheme ClaudeHUDTests
  ClaudeHUDTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudeHUDTests
      - path: ClaudeHUD/Services/ClaudeProcessClassifier.swift
      - path: ClaudeHUD/Services/VaultProjectTree.swift
      - path: ClaudeHUD/Services/ActiveTasks.swift
      - path: ClaudeHUD/Services/VaultAccess.swift
      - path: ClaudeHUD/Services/TranscriptHead.swift
      - path: ClaudeHUD/Services/SessionFiling.swift
      - path: ClaudeHUD/Services/SessionHost.swift
      - path: ClaudeHUD/Services/SessionScan.swift
      - path: ClaudeHUD/Services/IMacLauncher.swift
      - path: ClaudeHUD/Services/PanelToggle.swift
      - path: ClaudeHUD/Services/HostProcs.swift
      - path: ClaudeHUD/Services/WezTermService.swift
      - path: ClaudeHUD/Services/RemoteControlReload.swift
      - path: ClaudeHUD/Services/MenuBarHiding.swift
      - path: ClaudeHUD/Services/DictationLight.swift
      - path: ClaudeHUD/Views/StripHosting.swift
      - path: ClaudeHUD/Services/PanelPlacement.swift
      - path: ClaudeHUD/Services/SecurityTool.swift
      - path: TopazLauncher/AppMatcher.swift
      - path: TopazLauncher/SnapLayout.swift
      - path: TopazLauncher/HotKeyCenter.swift
      - path: TopazLauncher/WindowMover.swift
    dependencies:
      - package: TopazKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudehud.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets:
        - ClaudeHUDTests
