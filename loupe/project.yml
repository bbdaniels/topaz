name: Loupe
options:
  bundleIdPrefix: com.bbdaniels.topaz
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

# Code the Topaz helpers share (Loupe and Topaz Launcher).
packages:
  TopazKit:
    path: TopazKit

targets:
  Loupe:
    type: application
    platform: macOS
    sources:
      - path: Loupe
        excludes:
          - "**/*.entitlements"
    resources:
      - path: Loupe/Resources/ntfy-notify.sh
    dependencies:
      - sdk: CoreText.framework
      - package: TopazKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbdaniels.topaz.loupe
        PRODUCT_NAME: Loupe
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: Loupe/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Loupe/Resources/Loupe.entitlements
        CODE_SIGN_IDENTITY: "ClaudeHUD Dev"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO

  # Topaz Launcher: the application launcher (Option-Space) and Magnet's
  # window snapping, nested in Topaz.app/Contents/Helpers and supervised by
  # Topaz (wezterm-gui helpers.rs). Built by topaz-build.sh.
  TopazLauncher:
    type: application
    platform: macOS
    sources:
      - path: TopazLauncher
        excludes:
          - Info.plist
    dependencies:
      - package: TopazKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbdaniels.topaz.launcher
        PRODUCT_NAME: "Topaz Launcher"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: TopazLauncher/Info.plist
        CODE_SIGN_IDENTITY: "ClaudeHUD Dev"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
    scheme: {}

  # Unit tests for the pure, Foundation-only logic. No host app: the bundle
  # compiles the sources it tests directly, so tests never launch Loupe.
  # Run: xcodebuild test -scheme LoupeTests
  LoupeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LoupeTests
      - path: Loupe/Services/ClaudeProcessClassifier.swift
      - path: Loupe/Services/VaultProjectTree.swift
      - path: Loupe/Services/ActiveTasks.swift
      - path: Loupe/Services/VaultAccess.swift
      - path: Loupe/Services/TranscriptHead.swift
      - path: Loupe/Services/SessionFiling.swift
      - path: Loupe/Services/SessionHost.swift
      - path: Loupe/Services/SessionScan.swift
      - path: Loupe/Services/IMacLauncher.swift
      - path: Loupe/Services/PanelToggle.swift
      - path: Loupe/Services/HostProcs.swift
      - path: Loupe/Services/WezTermService.swift
      - path: Loupe/Services/RemoteControlReload.swift
      - path: Loupe/Services/MenuBarHiding.swift
      - path: Loupe/Services/DictationLight.swift
      - path: Loupe/Views/StripHosting.swift
      - path: Loupe/Services/PanelPlacement.swift
      - path: Loupe/Services/SecurityTool.swift
      - path: Loupe/Services/DataMigration.swift
      - path: TopazLauncher/AppMatcher.swift
      - path: TopazLauncher/SnapLayout.swift
      - path: TopazLauncher/HotKeyCenter.swift
      - path: TopazLauncher/WindowMover.swift
    dependencies:
      - package: TopazKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbdaniels.topaz.loupe.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets:
        - LoupeTests
